apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 5-services-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: services.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      - path: /api/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8080

      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8080

      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080

      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port: 
              number: 8080