apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend-service
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: kubernetes-5-services-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80



---       # YAML document separator.


apiVersion: v1

kind: Service

metadata:
  name: frontend-service

spec:
  type: LoadBalancer

  selector:
    app: frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80