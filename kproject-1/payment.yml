apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: kubernetes-5-services-payment-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080

---


apiVersion: v1

kind: Service

metadata:
  name: payment-service

spec:
  type: LoadBalancer

  selector:
    app: payment

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
