apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: user
        image: kubernetes-5-services-user-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080

---


apiVersion: v1

kind: Service

metadata:
  name: user-service

spec:
  type: LoadBalancer

  selector:
    app: user

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
