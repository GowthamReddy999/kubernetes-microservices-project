apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
      - name: product
        image: kubernetes-5-services-product-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080

---


apiVersion: v1

kind: Service

metadata:
  name: product-service

spec:
  type: LoadBalancer

  selector:
    app: product

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
