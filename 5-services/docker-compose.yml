services:

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"


  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8081:8080"


  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - payment-service
    ports:
      - "8082:8080"


  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8083:8080"


  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      - product-service
    ports:
      - "8084:8080"