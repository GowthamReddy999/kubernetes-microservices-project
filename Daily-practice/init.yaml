apiVersion: v1
kind: Pod
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  initContainers:
    
    - name: mydb-setup
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup myservice1.default.svc.cluster.local; do echo 'waiting for myservice up'; sleep 2; done"]

    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup myservice.default.svc.cluster.local; do echo 'waiting for myservice up'; sleep 2; done"]
  
  containers:
    - name: my-app
      image: busybox:1.36
      env:
        - name: FIRSTNAME
          value: "Gowtham"
      command: ["sh", "-c", "echo 'my-app container is working properly' && sleep 3600"]
